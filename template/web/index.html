<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Figtree';font-weight:600;src:url(fonts/figtree-latin-600-normal.woff2) format('woff2');}
@font-face{font-family:'Figtree';font-weight:700;src:url(fonts/figtree-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:'Figtree';font-weight:800;src:url(fonts/figtree-latin-800-normal.woff2) format('woff2');}
@font-face{font-family:'JBM';font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:'JBM';font-weight:800;src:url(fonts/jetbrains-mono-latin-800-normal.woff2) format('woff2');}
@font-face{font-family:'Inter';font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format('woff2');}
@font-face{font-family:'Inter';font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format('woff2');}
@font-face{font-family:'Inter';font-weight:700;src:url(fonts/inter-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:'Fraunces';font-weight:600;src:url(fonts/fraunces-latin-600-normal.woff2) format('woff2');}
@font-face{font-family:'Fraunces';font-weight:700;src:url(fonts/fraunces-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:'Fraunces';font-weight:900;src:url(fonts/fraunces-latin-900-normal.woff2) format('woff2');}
html,body{margin:0;padding:0;background:#070B24;overflow:hidden;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#070B24;}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block;}
#scrim{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to bottom, rgba(6,8,22,.62) 0px, rgba(6,8,22,.40) 330px, rgba(6,8,22,0) 700px),
  linear-gradient(to top, rgba(6,8,22,.70) 0px, rgba(6,8,22,.42) 260px, rgba(6,8,22,0) 560px);}
#ui{position:absolute;inset:0;pointer-events:none;color:#fff;}
.abs{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform,opacity;}
/* captions: ≤3 words, said words dimmer, keyword on amber */
#cap{position:absolute;left:0;right:0;top:300px;text-align:center;font:700 64px/1.25 'Figtree',sans-serif;letter-spacing:-0.5px;white-space:nowrap;text-shadow:0 3px 0 rgba(5,7,20,.55),0 0 22px rgba(5,7,20,.75);}
#cap .w{display:inline-block;margin:0 9px;color:#fff;padding:2px 4px;border-radius:14px;}
#cap .w.said{color:rgba(255,255,255,.66);}
#cap .w.fut{visibility:hidden;}
#cap .w.kw{color:#1C1300;font-weight:800;background:#F7A600;padding:2px 16px;margin:0 6px;text-shadow:none;box-shadow:0 6px 22px rgba(5,7,20,.45);}
#cap .w.kw.said{color:#1C1300;background:#D99200;}
/* hook card: first frame (= the cover) until the hook sentence ends; same type as the title card */
.hook{text-align:center;text-shadow:0 0 34px rgba(5,7,20,.95),0 0 12px rgba(5,7,20,.7),0 5px 0 rgba(5,7,20,.6);}
.hook .n{font:900 112px/1.04 'Fraunces',serif;letter-spacing:-2.5px;color:#fff;white-space:pre;}
.hook .n em{font-style:normal;color:#FFC84A;}
.hook .s{margin-top:28px;font:700 24px/1 'Inter',sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#FFE1A0;}
/* big number: 1.5-3 s, the most shocking number of the story (script.py BIG) */
.bigbg{z-index:5;width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 45%,rgba(8,10,26,.62) 0%,rgba(8,10,26,.86) 62%,rgba(8,10,26,.94) 100%);}
.big{z-index:6;text-align:center;}
.big svg{display:block;margin:0 auto 10px;overflow:visible;}
.big svg polyline{fill:none;stroke:#FF6B5B;stroke-width:10;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 12px rgba(255,90,70,.85));}
.big.up svg polyline{stroke:#F7A600;filter:drop-shadow(0 0 12px rgba(247,166,0,.85));}
.big .v{font:800 172px/1 'JBM',monospace;letter-spacing:-7px;color:#FF6B5B;white-space:nowrap;text-shadow:0 0 44px rgba(255,90,70,.55),0 6px 0 rgba(5,7,20,.6);}
.big.up .v{color:#FFC84A;text-shadow:0 0 44px rgba(247,166,0,.55),0 6px 0 rgba(5,7,20,.6);}
.big .v small{font-size:.42em;letter-spacing:.02em;margin-left:18px;vertical-align:.62em;}
.big .l{margin-top:28px;font:700 34px/1.3 'Figtree',sans-serif;color:#fff;white-space:pre;text-shadow:0 0 18px rgba(5,7,20,.9);}
.big .d{margin-top:18px;font:700 22px/1 'Inter',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#FFE1A0;}
/* big number over the live world (beat2: world): a small dark plate, no full-screen dim */
.big.world{padding:30px 44px 36px;background:rgba(8,10,26,.80);border:2.5px solid rgba(255,225,160,.55);border-radius:40px;box-shadow:0 20px 64px rgba(5,7,20,.55);}
.big.world svg{width:560px;height:126px;margin-bottom:4px;}
.big.world .v{font-size:150px;}
.big.world .l{margin-top:18px;}
/* the lesson card (format v3): the one thing to take away and the check the viewer can use; built to be screenshotted */
.lcard{width:900px;box-sizing:border-box;padding:38px 40px 40px;text-align:center;background:rgba(8,10,26,.9);border:3px solid #F7A600;border-radius:36px;box-shadow:0 22px 70px rgba(5,7,20,.6);}
.lcard .k{display:inline-block;font:700 24px/1 'Inter',sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#1C1300;background:#F7A600;padding:12px 18px 11px 26px;border-radius:999px;}
.lcard .n{margin-top:30px;font:900 80px/1.08 'Fraunces',serif;letter-spacing:-1.5px;color:#fff;white-space:pre;}
.lcard .n em{font-style:normal;color:#FFC84A;}
.lcard .u{margin-top:30px;padding-top:26px;border-top:2px solid rgba(255,225,160,.35);font:700 38px/1.2 'Figtree',sans-serif;color:#FFE1A0;white-space:nowrap;}
/* CTA arm K: our reply under the comment box. CTA arm O: the open question */
.reply{display:flex;align-items:center;gap:18px;box-sizing:border-box;padding:16px 34px 16px 16px;border-radius:46px;background:rgba(255,255,255,.97);color:#1C1300;font:700 34px/1.15 'Figtree',sans-serif;box-shadow:0 16px 46px rgba(5,7,20,.55);}
.reply .av{flex:none;width:62px;height:62px;border-radius:50%;background:#F7A600;color:#1C1300;font:900 36px/62px 'Fraunces',serif;text-align:center;}
.reply small{display:block;font:700 18px/1 'Inter',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8A6A3A;margin-bottom:7px;}
.askq{width:900px;box-sizing:border-box;padding:34px 40px 36px;text-align:center;background:rgba(8,10,26,.88);border:2.5px solid rgba(255,225,160,.7);border-radius:34px;font:700 62px/1.14 'Fraunces',serif;color:#fff;white-space:normal;box-shadow:0 18px 50px rgba(5,7,20,.55);}
/* story stamps */
.year{font:900 190px/1 'Fraunces',serif;letter-spacing:-4px;color:#FFE9B0;text-shadow:0 0 46px rgba(247,166,0,.75),0 6px 0 rgba(5,7,20,.5);}
.sub{font:700 23px/1 'Inter',sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#FFE1A0;text-shadow:0 0 16px rgba(5,7,20,.9),0 2px 0 rgba(5,7,20,.6);}
.chip{font:700 24px/1 'Inter',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:rgba(8,10,26,.72);border:2px solid rgba(255,225,160,.55);padding:15px 26px 14px;border-radius:999px;box-shadow:0 8px 26px rgba(5,7,20,.35);}
.chip.am{background:#F7A600;color:#1C1300;border-color:#F7A600;}
.chip b{font:800 26px/1 'JBM',monospace;letter-spacing:0;color:#FFC84A;margin:0 4px;}
.name{text-align:center;text-shadow:0 0 26px rgba(5,7,20,.9),0 3px 0 rgba(5,7,20,.6);}
.name .n{font:700 78px/1 'Fraunces',serif;letter-spacing:-1px;color:#fff;}
.name .r{margin-top:12px;font:700 22px/1 'Inter',sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#FFD27A;}
.tag{font:700 21px/1 'Inter',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:rgba(8,10,26,.78);border:1.5px solid rgba(255,255,255,.4);padding:11px 16px 10px;border-radius:12px;}
.tag.am{color:#1C1300;background:#F7A600;border-color:#F7A600;}
.tag.am b{color:#1C1300;}
.tag.grey{color:#C9CFDA;background:rgba(40,44,60,.86);border-color:rgba(255,255,255,.25);}
.tag b{font:800 30px/1 'JBM',monospace;letter-spacing:0;vertical-align:-3px;margin:0 6px;color:#FFC84A;}
.route{width:760px;height:92px;}
.route .line{position:absolute;left:40px;right:40px;top:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);}
.route .fill{position:absolute;left:40px;top:26px;height:6px;border-radius:3px;background:#F7A600;box-shadow:0 0 16px rgba(247,166,0,.9);}
.route .dot{position:absolute;top:13px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#fff;border:6px solid #F7A600;box-sizing:border-box;box-shadow:0 0 0 5px rgba(8,10,26,.5);}
.route .nd{position:absolute;top:17px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#0B0E22;border:4px solid #fff;box-sizing:border-box;}
.route .lb{position:absolute;top:60px;transform:translateX(-50%);font:700 22px/1 'Inter',sans-serif;letter-spacing:.24em;color:#fff;text-shadow:0 0 14px rgba(5,7,20,.95),0 2px 0 rgba(5,7,20,.6);}
.pips{font:700 22px/1 'Inter',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#fff;text-shadow:0 0 14px rgba(5,7,20,.95);}
.pips i{display:inline-block;width:26px;height:26px;border-radius:50%;margin:0 6px;vertical-align:-6px;border:3px solid rgba(255,255,255,.8);box-sizing:border-box;background:rgba(8,10,26,.5);}
.pips i.on{background:#F7A600;border-color:#F7A600;box-shadow:0 0 14px rgba(247,166,0,.9);}
.pips.small i{width:18px;height:18px;margin:0 4px;vertical-align:-3px;border-width:2.5px;}
/* price board */
.board{width:760px;padding:30px 0 28px;text-align:center;background:rgba(8,10,26,.86);border:2px solid rgba(255,225,160,.6);border-radius:30px;box-shadow:0 18px 50px rgba(5,7,20,.5);}
.board .t{font:700 22px/1 'Inter',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#FFD27A;}
.board .row{margin-top:20px;font:600 34px/1 'Figtree',sans-serif;color:#fff;}
.board .row b{display:inline-block;min-width:150px;font:800 118px/1 'JBM',monospace;letter-spacing:-4px;color:#FFC84A;vertical-align:-30px;margin:0 16px;text-shadow:0 0 30px rgba(247,166,0,.5);}
.board .d{display:inline-block;margin-top:20px;font:800 30px/1 'JBM',monospace;color:#1C1300;background:#F7A600;padding:10px 18px;border-radius:12px;}
.board .y{margin-top:22px;}
.board .src{margin-top:18px;font:500 19px/1 'Inter',sans-serif;letter-spacing:.06em;color:rgba(255,255,255,.62);}
.title{text-align:center;text-shadow:0 0 30px rgba(5,7,20,.95),0 4px 0 rgba(5,7,20,.6);}
.title .s{font:700 23px/1 'Inter',sans-serif;letter-spacing:.4em;color:#FFD27A;}
.title .n{margin-top:18px;font:900 92px/1.04 'Fraunces',serif;letter-spacing:-2px;color:#fff;white-space:pre;}
.title .n em{font-style:normal;color:#FFC84A;}
.lesson{font:700 36px/1.3 'Figtree',sans-serif;color:#fff;background:rgba(8,10,26,.84);border:2px solid rgba(255,225,160,.6);padding:24px 34px;border-radius:26px;text-align:center;white-space:pre;box-shadow:0 14px 40px rgba(5,7,20,.5);}
.lesson em{font-style:normal;color:#FFC84A;}
.cta{text-align:center;}
.cta .h{width:190px;height:190px;margin:0 auto;border-radius:50%;background:rgba(8,10,26,.8);border:3px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px rgba(255,80,110,.45);}
.cta .x{margin-top:30px;font:800 54px/1.1 'Figtree',sans-serif;color:#fff;text-shadow:0 0 26px rgba(5,7,20,.95),0 3px 0 rgba(5,7,20,.6);}
.cta .y{margin-top:16px;font:700 23px/1 'Inter',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#FFD27A;text-shadow:0 0 16px rgba(5,7,20,.95);}
.shoot{width:210px;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95));box-shadow:0 0 12px rgba(255,255,255,.7);rotate:20deg;}
.meter{font:700 21px/1 'Inter',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#fff;text-shadow:0 0 12px rgba(5,7,20,.95);}
.meter span{vertical-align:middle;margin-right:16px;}
.meter .bar{display:inline-block;vertical-align:middle;width:300px;height:18px;border-radius:9px;background:rgba(8,10,26,.72);border:2px solid rgba(255,255,255,.6);overflow:hidden;}
.meter .fill{height:18px;background:#F7A600;}
.cbox{width:740px;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;padding:0 30px 0 34px;height:104px;border-radius:52px;background:rgba(8,10,26,.86);border:2.5px solid rgba(255,225,160,.7);box-shadow:0 16px 46px rgba(5,7,20,.55);}
.cbox .in{font:600 40px/1 'Figtree',sans-serif;color:#fff;}
.cbox .in em{font-style:normal;color:rgba(255,255,255,.5);}
.cbox .in b{font:800 46px/1 'Figtree',sans-serif;letter-spacing:2px;color:#FFC84A;}
.cbox .in i{display:inline-block;width:4px;height:44px;margin-left:6px;vertical-align:-6px;background:#FFC84A;}
.cbox .post{font:800 32px/1 'Figtree',sans-serif;color:rgba(255,255,255,.35);padding:16px 26px;border-radius:30px;}
.cbox .post.on{color:#1C1300;background:#F7A600;}
.cbox .post.sent{background:#3FAE6A;color:#fff;}
/* episode 2: price chart, loop, quote, fortune, letter */
.spark{width:800px;text-align:center;}
.spark svg{display:block;overflow:visible;}
.spark .sl{fill:none;stroke:#FFB52E;stroke-width:9;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 12px rgba(255,170,40,.95)) drop-shadow(0 3px 0 rgba(5,7,20,.5));}
.spark .sh{fill:#fff;stroke:#FFB52E;stroke-width:6;filter:drop-shadow(0 0 14px rgba(255,200,90,1));}
.spark .lbl{margin-top:10px;font:700 21px/1 'Inter',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#FFE1A0;text-shadow:0 0 16px rgba(5,7,20,.95),0 2px 0 rgba(5,7,20,.6);}
.chart{width:860px;height:470px;background:rgba(8,10,26,.86);border:2px solid rgba(255,225,160,.6);border-radius:30px;box-shadow:0 18px 50px rgba(5,7,20,.5);}
.chart .t{position:absolute;left:0;right:0;top:26px;text-align:center;font:700 22px/1 'Inter',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#FFD27A;}
.chart svg{position:absolute;left:0;top:60px;overflow:visible;}
.chart .grid{stroke:rgba(255,255,255,.14);stroke-width:2;}
.chart .ax{font:600 19px 'Inter',sans-serif;fill:rgba(255,255,255,.55);}
.chart .mo{font:700 20px 'Inter',sans-serif;fill:rgba(255,255,255,.6);}
.chart .ln{fill:none;stroke:#F7A600;stroke-width:7;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(247,166,0,.7));}
.chart .hd{fill:#fff;stroke:#F7A600;stroke-width:5;}
.chart .ref{stroke:rgba(255,255,255,.75);stroke-width:3;stroke-dasharray:10 10;opacity:0;}
.chart .mk{opacity:0;} .chart .mk circle{fill:#0B0E22;stroke:#fff;stroke-width:5;} .chart .mk.buy circle{stroke:#FF7A6B;}
.chart .mk text{font:800 22px 'Inter',sans-serif;letter-spacing:.12em;fill:#fff;}
.chart .lb{font:800 30px 'JBM',monospace;fill:#FFC84A;opacity:0;} .chart .lless{font:700 22px 'Inter',sans-serif;fill:#fff;letter-spacing:.06em;}
.loopc{font:700 34px/1 'Figtree',sans-serif;color:#fff;background:rgba(8,10,26,.84);border:2px solid rgba(255,225,160,.6);padding:20px 30px;border-radius:999px;box-shadow:0 12px 34px rgba(5,7,20,.45);}
.loopc .arr{margin:0 14px;color:#F7A600;font-weight:800;}
.quote{text-align:center;background:rgba(8,10,26,.86);border:2px solid rgba(255,225,160,.6);border-radius:26px;padding:30px 44px 28px;box-shadow:0 14px 40px rgba(5,7,20,.5);}
.quote .q{font:700 44px/1.28 'Fraunces',serif;color:#fff;}
.quote .q em{font-style:normal;color:#FFC84A;}
.quote .s{margin-top:18px;font:600 19px/1 'Inter',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,225,160,.8);}
.meter b{display:inline-block;margin-left:14px;vertical-align:middle;font:800 30px/1 'JBM',monospace;color:#FFC84A;letter-spacing:0;}
.worth{width:700px;padding:28px 0 30px;text-align:center;background:rgba(8,10,26,.86);border:2px solid rgba(255,225,160,.6);border-radius:30px;box-shadow:0 18px 50px rgba(5,7,20,.5);}
.worth .t{font:700 22px/1 'Inter',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#FFD27A;}
.worth .row{margin-top:24px;font:800 64px/1 'JBM',monospace;color:#fff;letter-spacing:-2px;}
.worth .row .v1{color:#FFC84A;} .worth .row .arr{margin:0 18px;color:rgba(255,255,255,.6);font:700 48px/1 'Figtree',sans-serif;}
.worth .bar{margin:26px auto 0;width:560px;height:26px;border-radius:13px;background:rgba(255,255,255,.1);display:flex;overflow:hidden;}
.worth .fill{height:26px;background:#F7A600;} .worth .gone{height:26px;background:repeating-linear-gradient(45deg,#7A7E90 0 8px,#4A4E5E 8px 16px);}
.worth .d{display:inline-block;margin-top:22px;font:800 28px/1 'Inter',sans-serif;letter-spacing:.08em;color:#1C1300;background:#F7A600;padding:11px 20px;border-radius:12px;opacity:0;}
.letter{width:820px;box-sizing:border-box;padding:34px 46px 30px;background:linear-gradient(#F6EBD0,#E9D6AC);border-radius:18px;box-shadow:0 18px 50px rgba(5,7,20,.55);text-align:left;white-space:normal;}
.letter .h{font:700 20px/1 'Inter',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#8A6A3A;}
.letter .tx{margin-top:22px;min-height:124px;font:700 50px/1.24 'Fraunces',serif;color:#2E2014;}
.letter .tx i{display:inline-block;width:4px;height:46px;margin-left:4px;vertical-align:-6px;background:#8A6A3A;}
.letter .sg{margin-top:22px;font:600 22px/1 'Inter',sans-serif;color:#6A5030;text-align:right;}
#foot{position:absolute;left:0;right:0;top:1556px;text-align:center;font:500 18.5px/1.5 'Inter',sans-serif;color:rgba(255,255,255,.66);letter-spacing:.01em;white-space:pre;text-shadow:0 0 10px rgba(5,7,20,.9);}
</style>
